[build]
  # Build command
  command = "npm run build"
  # Directory to publish (build output)
  publish = "dist"

[build.environment]
  # Node version
  NODE_VERSION = "18"
  # API Base URL for backend communication (HTTP for now)
  VITE_API_BASE_URL = "http://128.199.30.160:3000"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to HTTP backend
[[redirects]]
  from = "/api/*"
  to = "http://128.199.30.160:3000/:splat"
  status = 200

# Security headers (relaxed for HTTP backend)
[[headers]]
  for = "/*"
  [headers.values]
    # Allow mixed content for HTTP backend
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://128.199.30.160:3000 https://128.199.30.160:3000; font-src 'self';"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # XSS protection
    X-XSS-Protection = "1; mode=block"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
